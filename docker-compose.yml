version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://metro_user:metro_pass@db:5432/metro_rush
      - JWT_SECRET=metro_rush_secret_jwt_key_2026
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-placeholder}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=metro_user
      - POSTGRES_PASSWORD=metro_pass
      - POSTGRES_DB=metro_rush
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
